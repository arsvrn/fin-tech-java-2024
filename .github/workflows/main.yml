name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Клонирование репозитория
    - name: Checkout code
      uses: actions/checkout@v3

    # Настройка JDK
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adoptopenjdk'

    # Кэширование зависимостей Gradle для ускорения сборки
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Сборка проекта и прогон тестов
    - name: Build and test with Gradle
      run: ./gradlew clean build

    # Проверка покрытия тестами с использованием JaCoCo
    - name: Upload JaCoCo test coverage report
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/html

    # Статический анализ кода
    - name: Run static code analysis (Checkstyle)
      run: ./gradlew check

    # Создание Docker-образа
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }} .
    
    # Вход в GitHub Packages Docker Registry
    - name: Log in to GitHub Docker Registry
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.GITHUB_USERNAME }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Заливка Docker-образа в GitHub Packages
    - name: Push Docker image to GitHub Packages
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }} ghcr.io/${{ secrets.GITHUB_USERNAME }}/my-app:${{ github.sha }}
        docker push ghcr.io/${{ secrets.GITHUB_USERNAME }}/my-app:${{ github.sha }}
