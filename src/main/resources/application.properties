cbr.api.url=http://www.cbr.ru/scripts/XML_daily.asp
cbr.api.date_format=dd/MM/yyyy

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

executor.fixed.thread-pool-size=10
data.initialization.interval=PT30M

kudago.events.api.url=https://kudago.com/public-api/v1.4/events/
api.kudago.concurrent-requests-limit=5

spring.datasource.url=jdbc:postgresql://localhost:5432/fin_tech
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.yaml
spring.liquibase.url=jdbc:postgresql://localhost:5432/fin_tech
spring.liquibase.user=postgres
spring.liquibase.password=12345678

spring.jpa.hibernate.ddl-auto=none